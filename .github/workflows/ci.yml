name: Dhristi CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build, Lint, Polyglot Verification & Playwright E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Java Environment
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Verify Python Disaster Helper Scripts
        run: |
          python scripts/hazard_zone_analyzer.py
          python scripts/shelter_capacity_manager.py

      - name: Verify Java Disaster Telemetry Processor
        run: |
          javac scripts/DisasterTelemetryProcessor.java
          java scripts.DisasterTelemetryProcessor

      - name: Build Next.js Application
        run: npm run build

      - name: Install Playwright Browsers & OS Dependencies
        run: npx playwright install --with-deps chromium

      - name: Execute Playwright End-to-End Test Suite
        run: npx playwright test
        env:
          CI: 'true'

      - name: Upload Playwright Test Report as Artifact
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-e2e-report
          path: playwright-report/
          retention-days: 14
